version: "2"

run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    goconst:
      ignore-tests: true
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - -SA1019
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
        text: "G115: integer overflow conversion"
      # Deprecated axiom-go APIs the module still has to reference and test.
      - linters:
          - staticcheck
        text: "SA1019:.*(BlocksCreated|WALLength) is deprecated"
      - linters:
          - revive
        path: adapters/slog/
        text: "var-naming: avoid package names that conflict"
      - linters:
          - revive
        path: internal/version/
        text: "var-naming: avoid package names that conflict"
    paths:
      - .git
      - .github
      - .vscode
      - dist

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/axiomhq/axiom-go
  exclusions:
    generated: lax
    paths:
      - .git
      - .github
      - .vscode
      - dist
